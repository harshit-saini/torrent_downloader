services:
  - type: web
    name: torrent-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: torrent-db
          property: connectionString
      - key: APP_PASSWORD
        sync: false
      - key: TOKEN_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: MAX_TORRENT_GB
        value: "1"

databases:
  - name: torrent-db
    plan: free
